name: documenting-component-eval
description: |
  Evaluates whether an agent invokes documenting-component and writes one
  focused, evidence-backed page with a useful presentation choice across
  behavioral, structural, and migration scenarios.
skill: documenting-component
schemaVersion: "1.2"
version: "2.0"

config:
  trials_per_task: 3
  timeout_seconds: 600
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-4.6
  skill_directories:
    - ../../skills

tasks:
  - "tasks/*.yaml"
