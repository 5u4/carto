id: documenting-component-structural-001
name: Document the job lifecycle definition
description: |
  The agent documents a structural lifecycle component and its coordinator
  neighbor without requiring a visual when prose is clearer.
tags:
  - documenting-component
  - structural
  - happy-path

inputs:
  prompt: |
    Can you document the job lifecycle component as `docs/job-lifecycle.md`?
    New engineers keep confusing lifecycle states with coordinator behavior.
    Explain why one authoritative lifecycle definition matters, what it owns,
    how `JobCoordinator` uses it, which transitions are valid, and from which
    state `start` is allowed. This should be a focused reference page, not an
    overview of the whole service.
  files:
    - path: src/job-lifecycle.ts
    - path: src/job-coordinator.ts

expected:
  outcomes:
    - type: task_completed

graders:
  - type: skill_invocation
    name: documenting_component_invoked
    config:
      mode: any_order
      required_skills:
        - documenting-component
      allow_extra: true
  - type: program
    name: structural_page_contract
    config:
      command: python3
      args: ["evals/documenting-component/graders/check_page.py", "structural"]
      timeout: 60
  - type: prompt
    name: structural_semantic_quality
    config:
      model: claude-sonnet-4.6
      continue_session: true
      prompt: |
        Judge the documentation page produced in this session on six semantic
        qualities:
        1. Narrowness: it stays centered on the lifecycle definition rather
           than becoming a broad jobs-system overview.
        2. Intent: it explains why one lifecycle definition exists and what it
           protects.
        3. Neighbors: it distinguishes lifecycle ownership from the
           coordinator's use of that definition.
        4. Mental model: a reader can reason about states, allowed movement,
           terminality, and invalid transitions.
        5. Visual usefulness: the chosen presentation is the smallest one that
           improves understanding; clear prose-only treatment is fully valid.
        6. Evidence quality: every load-bearing claim and visual fact has a
           nearby path:line anchor whose cited code supports it.
        Call set_waza_grade_pass exactly once only if all six qualities are
        satisfied. Otherwise call set_waza_grade_fail exactly once and identify
        the weak qualities.
