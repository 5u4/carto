id: documenting-component-behavioral-001
name: Document the request limiter behavior
description: |
  The agent documents a deterministic TokenBucket, its shared decision
  contract, and the caller that consumes it.
tags:
  - documenting-component
  - behavioral
  - happy-path

inputs:
  prompt: |
    Please write `docs/token-bucket.md` explaining the request limiter behind
    `allowApiRequest`. This is for an on-call engineer who needs to reason about
    bursts, refills, and rejected requests. Trace how `RateLimiter` and
    `RateLimitDecision` connect the caller to the bucket, and include the
    reproducible output of `sampleApiLimitTrace()` so they can verify their
    understanding. Keep the page focused on this limiter.
  files:
    - path: src/rate-limit-contract.ts
    - path: src/token-bucket.ts
    - path: src/api-request-limiter.ts

expected:
  outcomes:
    - type: task_completed

graders:
  - type: skill_invocation
    name: documenting_component_invoked
    config:
      mode: any_order
      required_skills:
        - documenting-component
      allow_extra: true
  - type: program
    name: behavioral_page_contract
    config:
      command: python3
      args: ["evals/documenting-component/graders/check_page.py", "behavioral"]
      timeout: 60
  - type: prompt
    name: behavioral_semantic_quality
    config:
      model: claude-sonnet-4.6
      continue_session: true
      prompt: |
        Judge the documentation page produced in this session on six semantic
        qualities:
        1. Narrowness: it stays centered on the request limiter rather than
           becoming a broad service overview.
        2. Intent: it explains the code-supported constraint the limiter
           enforces and its system role without inventing product motivation.
        3. Neighbors: it makes the relationship among the bucket, shared
           decision contract, and caller understandable.
        4. Mental model: a reader can reason about capacity, elapsed-time
           refill, consumption, and rejection.
        5. Visual usefulness: exactly one explanatory view earns its place by
           making the behavior easier to understand and stays proportionate.
        6. Evidence quality: every load-bearing claim and visual fact has a
           nearby path:line anchor whose cited code supports it.
        Call set_waza_grade_pass exactly once only if all six qualities are
        satisfied. Otherwise call set_waza_grade_fail exactly once and identify
        the weak qualities.
