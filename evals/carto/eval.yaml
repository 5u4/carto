name: carto-eval
description: |
  Runs one lightweight end-to-end smoke over a small TypeScript codebase:
  generate Carto docs in English and Chinese, validate them, and render the site.
skill: carto
schemaVersion: "1.2"
version: "1.0"

config:
  trials_per_task: 1
  timeout_seconds: 900
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-4.6
  skill_directories:
    - ../../skills

tasks:
  - "tasks/*.yaml"
